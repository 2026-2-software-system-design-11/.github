name: 설정
description: 빌드, CI, 의존성, 저장소 설정을 바꾼다
title: "[chore] "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: '이 이슈를 닫는 PR은 설정 PR 템플릿(chore.md)을 쓰고, 커밋은 `build(범위): 요약 (#이슈번호)` 또는 `ci(범위): 요약 (#이슈번호)` 형식으로 쓴다.'
  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 다른 팀원 작업에 영향이 있으면 쓴다. (선택)
