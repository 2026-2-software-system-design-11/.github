name: 테스트
description: 테스트 코드를 추가하거나 고친다
title: "[test] "
labels: ["test"]
body:
  - type: markdown
    attributes:
      value: '이 이슈를 닫는 PR은 테스트 PR 템플릿(test.md)을 쓰고, 커밋은 `test(범위): 요약 (#이슈번호)` 형식으로 쓴다.'
  - type: textarea
    id: target
    attributes:
      label: 테스트 대상
      description: 테스트할 모듈, 클래스, 기능을 쓴다.
    validations:
      required: true
  - type: textarea
    id: cases
    attributes:
      label: 추가할 테스트
      description: 확인할 경우를 나열한다.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
    validations:
      required: true
